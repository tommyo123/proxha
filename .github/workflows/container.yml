name: Build and publish container

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: Build and test ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image identity
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: proxha:ci
          build-args: |
            VERSION=sha-${{ github.sha }}
            REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=container-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=container-${{ matrix.arch }}
      - name: Sign in to GitHub Container Registry
        if: github.event.repository.private == false && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish built architecture
        if: github.event.repository.private == false && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          docker tag proxha:ci "$IMAGE:sha-$GITHUB_SHA-$ARCH"
          docker push "$IMAGE:sha-$GITHUB_SHA-$ARCH"

  publish:
    name: Publish multi-platform tags
    if: github.event.repository.private == false && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish latest, commit and version tags
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags=(--tag "$image:sha-$GITHUB_SHA")
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            tags+=(--tag "$image:latest" --tag "$image:main")
          elif [[ "$GITHUB_REF_NAME" =~ ^v[0-9A-Za-z_.-]{1,126}$ ]]; then
            tags+=(--tag "$image:$GITHUB_REF_NAME")
          else
            echo 'Release tags must be valid Docker tags beginning with v.' >&2
            exit 1
          fi
          docker buildx imagetools create "${tags[@]}" "$image:sha-$GITHUB_SHA-amd64" "$image:sha-$GITHUB_SHA-arm64"
          docker buildx imagetools inspect "$image:sha-$GITHUB_SHA"
          echo "Published \`$image:sha-$GITHUB_SHA\` for linux/amd64 and linux/arm64." >> "$GITHUB_STEP_SUMMARY"

  registry-check:
    name: Pull published image
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull from GHCR and verify tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-$GITHUB_SHA"
          docker pull "$image"
          docker buildx imagetools inspect "$image"
